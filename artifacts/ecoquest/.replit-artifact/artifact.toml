kind = "web"
previewPath = "/"
title = "EcoQuest"
version = "1.0.0"
id = "artifacts/ecoquest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20365

[services.development]
run = "pnpm --filter @workspace/ecoquest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecoquest", "run", "build" ]
publicDir = "artifacts/ecoquest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20365"
BASE_PATH = "/"
